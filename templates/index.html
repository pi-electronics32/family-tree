<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Family Legacy</title>
<style>
:root{
  --bg:#0d120f; --panel:#151c17; --panel2:#1b241e; --gold:#d6b36a;
  --text:#f4f1e8; --muted:#aeb7ae; --line:#4c5b4e; --accent:#7ea56f;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#233226 0,#0d120f 48%,#080b09 100%);
font-family:Georgia,"Times New Roman",serif;color:var(--text)}
header{padding:44px 20px 28px;text-align:center;border-bottom:1px solid #263128}
.kicker{letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-size:12px}
h1{font-size:clamp(32px,6vw,64px);margin:10px 0 6px}
.subtitle{color:var(--muted);font-family:Arial,sans-serif;font-size:14px}
.wrap{max-width:1400px;margin:auto;padding:24px 18px 60px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 auto 28px}
input{width:min(520px,100%);padding:14px 18px;border-radius:999px;border:1px solid #344238;
background:#111712;color:white;outline:none;font-size:15px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.stat{background:#111712;border:1px solid #2d392f;border-radius:14px;padding:10px 16px;text-align:center}
.stat b{display:block;color:var(--gold);font-size:20px}.stat span{font:12px Arial;color:var(--muted)}
.generation{margin:34px 0}
.generation h2{text-align:center;font-size:21px;font-weight:normal;color:var(--gold);letter-spacing:2px}
.tree-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;position:relative}
.card{width:210px;background:linear-gradient(145deg,var(--panel2),var(--panel));
border:1px solid #354238;border-radius:18px;padding:18px;box-shadow:0 10px 30px #0006;
transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.avatar{width:52px;height:52px;border-radius:50%;margin-bottom:12px;display:grid;place-items:center;
background:#263429;border:1px solid #536557;color:var(--gold);font-size:20px}
.name{font-size:18px;font-weight:bold;line-height:1.2}.meta{font:12px Arial;color:var(--muted);margin-top:6px}
.note{font:12px Arial;color:#c8cec9;margin-top:10px;line-height:1.45}
.badge{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:20px;background:#263429;
color:#b8d0b1;font:11px Arial}
.relationships{margin-top:44px;background:#101611;border:1px solid #29362c;border-radius:18px;padding:20px}
.relationships h2{text-align:center;color:var(--gold);font-weight:normal}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rel{font:13px Arial;color:#d9dfda;background:#151d17;padding:11px;border-radius:10px}
.rel b{color:white}
.empty{text-align:center;color:var(--muted);padding:35px;display:none}
footer{text-align:center;color:#778078;font:12px Arial;padding:20px}
@media(max-width:600px){.card{width:100%;max-width:330px}header{padding-top:30px}}
</style>
</head>
<body>
<header>
  <div class="kicker">Family Legacy</div>
  <h1>Roots That Made Us</h1>
  <div class="subtitle">A living record of our family, generations and relationships.</div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search a family member..." autocomplete="off">
  </div>

  <div class="stats">
    <div class="stat"><b id="peopleCount">{{ people|length }}</b><span>Family Members</span></div>
    <div class="stat"><b id="relCount">{{ relationships|length }}</b><span>Relationships</span></div>
  </div>

  <div id="tree"></div>
  <div id="empty" class="empty">No family member found.</div>

  <section class="relationships">
    <h2>Family Connections</h2>
    <div class="rel-grid" id="relGrid"></div>
  </section>
</main>

<footer>Our Family Legacy · Preserving names, stories and connections for generations.</footer>

<script>
const people = {{ people|tojson }};
const relationships = {{ relationships|tojson }};

const byId = Object.fromEntries(people.map(p => [p.id, p]));
const parents = {};
relationships.filter(r => r.relation === "parent").forEach(r => {
  (parents[r.person2] ||= []).push(r.person1);
});

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function generationGroups(){
  const roots = people.filter(p => !parents[p.id]);
  const level = {};
  const queue = roots.map(p => [p.id,0]);
  const seen = new Set();
  while(queue.length){
    const [id,l] = queue.shift();
    if(seen.has(id)) continue;
    seen.add(id); level[id]=l;
    relationships.filter(r=>r.relation==="parent" && r.person1===id)
      .forEach(r=>queue.push([r.person2,l+1]));
  }
  people.forEach(p=>{ if(level[p.id]===undefined) level[p.id]=0; });
  const groups={};
  people.forEach(p=>(groups[level[p.id]] ||= []).push(p));
  return groups;
}

function card(p){
  const spouseIds = relationships.filter(r=>r.relation==="spouse" && (r.person1===p.id||r.person2===p.id))
    .map(r=>r.person1===p.id?r.person2:r.person1);
  const spouseNames = spouseIds.map(id=>byId[id]?.name).filter(Boolean);
  return `<article class="card" data-name="${p.name.toLowerCase()}">
    <div class="avatar">${initials(p.name)}</div>
    <div class="name">${escapeHtml(p.name)}</div>
    <div class="meta">${p.gender==="M"?"Male":p.gender==="F"?"Female":"Family Member"}</div>
    ${spouseNames.length?`<div class="badge">♥ ${spouseNames.map(escapeHtml).join(" · ")}</div>`:""}
    ${p.notes?`<div class="note">${escapeHtml(p.notes)}</div>`:""}
  </article>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function render(){
  const tree=document.getElementById("tree");
  const groups=generationGroups();
  tree.innerHTML="";
  Object.keys(groups).sort((a,b)=>a-b).forEach((level)=>{
    const section=document.createElement("section");
    section.className="generation";
    section.innerHTML=`<h2>GENERATION ${Number(level)+1}</h2>
      <div class="tree-row">${groups[level].map(card).join("")}</div>`;
    tree.appendChild(section);
  });
}

function renderRelationships(){
  const grid=document.getElementById("relGrid");
  grid.innerHTML=relationships.map(r=>{
    const a=byId[r.person1]?.name||"Unknown";
    const b=byId[r.person2]?.name||"Unknown";
    return `<div class="rel"><b>${escapeHtml(a)}</b> ${r.relation==="spouse"?"♥ married to":"→ child of"} <b>${escapeHtml(b)}</b></div>`;
  }).join("");
}

document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase().trim();
  let found=0;
  document.querySelectorAll(".card").forEach(c=>{
    const ok=c.dataset.name.includes(q);
    c.style.display=ok?"block":"none";
    if(ok) found++;
  });
  document.getElementById("empty").style.display=found?"none":"block";
});

render();
renderRelationships();
</script>
</body>
</html>
