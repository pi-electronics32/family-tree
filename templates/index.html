<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Family Legacy</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080c09;--card:#141b16;--card2:#1a241c;--gold:#d7b56d;--text:#f5f1e7;--muted:#aeb6ae;--line:#657362}
body{margin:0;background:radial-gradient(circle at top,#243327,#080c09 55%);color:var(--text);font-family:Georgia,serif}
header{text-align:center;padding:38px 18px 24px;border-bottom:1px solid #263128}
.kicker{font:12px Arial;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(34px,6vw,60px);margin:9px 0 5px}.sub{font:14px Arial;color:var(--muted)}
.toolbar{text-align:center;padding:20px 14px}
input{width:min(540px,100%);padding:13px 18px;border-radius:25px;border:1px solid #3a473d;background:#101611;color:white;font-size:16px}
.tree{overflow-x:auto;padding:5px 12px 70px}
.level{margin:20px auto 55px;width:max-content;min-width:100%}
.level-title{text-align:center;color:var(--gold);font:600 14px Arial;letter-spacing:2px;margin-bottom:20px}
.root-row,.branch-row{display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}
.unit{display:flex;flex-direction:column;align-items:center;position:relative}
.couple{display:flex;align-items:center;gap:7px}
.plus{font:bold 25px Georgia;color:var(--gold)}
.card{width:175px;min-height:105px;padding:12px;border:1px solid #354238;border-radius:16px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:0 8px 24px #0007}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#273429;border:1px solid #5b6c5a;color:var(--gold);font-size:13px;margin-bottom:7px}
.name{font-weight:bold;font-size:15px;line-height:1.2}.meta{font:11px Arial;color:var(--muted);margin-top:4px}.note{font:11px Arial;color:#c4cbc5;margin-top:7px}
.down{height:24px;width:2px;background:var(--line)}
.children{position:relative;display:flex;justify-content:center;gap:22px;padding-top:28px}
.children:before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--line)}
.child{position:relative;padding-top:0}
.child:before{content:"";position:absolute;top:-28px;left:50%;height:28px;width:2px;background:var(--line);transform:translateX(-50%)}
.search-hide{display:none!important}
.empty{text-align:center;color:var(--muted);font:14px Arial;padding:30px;display:none}
@media(max-width:700px){.card{width:155px}.children{gap:12px}.tree{padding-left:6px;padding-right:6px}}

.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<header>
<div class="kicker">Family Legacy</div>
<h1>Roots That Made Us</h1>
<div class="sub">Our family — connected by generations</div>
</header>
<div class="toolbar"><input id="search" type="search" placeholder="Search family member..." autocomplete="off"></div>
<main id="tree" class="tree"></main>
<div id="empty" class="empty">No family member found.</div>

<script>
const DATA = {
  "Karan Singh": {gender:"M"},
  "Raja Singh": {gender:"M"},
  "Indradev Singh": {gender:"M", note:"Unmarried"},
  "Matki Singh": {gender:"M"},
  "RamPrit Singh": {gender:"M"},
  "Ram Bricch Singh": {gender:"M", note:"No children"},
  "Bhagwan Singh": {gender:"M", note:"No children"},
  "Ganesh Singh": {gender:"M"},
  "Matishra Kunwar": {gender:"F"},
  "Gulabo Devi": {gender:"F"},
  "Jeera Devi": {gender:"F"},
  "Jaglal Singh": {gender:"M"},
  "Rajkali Devi": {gender:"F"},
  "Jairam Singh": {gender:"M"},
  "Phulahi Devi": {gender:"F"},
  "Lalpati Devi": {gender:"F"},
  "Shushil K Singh": {gender:"M"},
  "Late Dr. Sunita Singh": {gender:"F"},
  "Vakil Singh": {gender:"M"},
  "Sumitra Devi": {gender:"F"},
  "Kedarnath Singh": {gender:"M"},
  "Anita Devi": {gender:"F"},
  "Poornima Devi": {gender:"F"},
  "Sanjeet Singh": {gender:"M"},
  "Bijendra Singh": {gender:"M"},
  "Poonam Devi": {gender:"F"},
  "Biresh K Singh": {gender:"M"},
  "Lovely Devi": {gender:"F"},
  "Chandani Devi": {gender:"F"},
  "Sanjeev Singh": {gender:"M"},
  "Arman Singh": {gender:"M"},
  "Vikash Kumar": {gender:"M"},
  "Ishita Raghuvanshi": {gender:"F"},
  "Pooja Singh": {gender:"F"},
  "Ankit (Pooja's husband)": {gender:"M"},
  "Preeti Singh": {gender:"F"},
  "Manoranjan Kumar": {gender:"M"},
  "Manish Singh": {gender:"M"},
  "Riya Kumari": {gender:"F"},
  "Khusboo Singh": {gender:"F"},
  "Akash": {gender:"M"},
  "Kajal": {gender:"F"},
  "Rohiit": {gender:"M"},
  "Ankit (Poornima's son)": {gender:"M"},
  "Priyanshu Singh": {gender:"M"},
  "Palak": {gender:"F"},
  "Simran": {gender:"F"},
  "Aditya": {gender:"M"},
  "Arushi": {gender:"F"},
  "Ishvika Kumar": {gender:"F"},
  "Ishan": {gender:"M"},
  "Aditi": {gender:"F"},
  "Siddhart": {gender:"M"},
  "Samridhhi": {gender:"F"},
  "Kartik": {gender:"M"}
};


const PHOTOS = {
  "Jaglal Singh": "/static/photos/jaglal-singh.jpg",
  "Rajkali Devi": "/static/photos/rajkali-devi.jpg",
  "Priyanshu Singh": "/static/photos/priyanshu-singh.jpg",
  "Palak": "/static/photos/palak.jpg"
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function initials(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();}
function card(name){
 const d=DATA[name]||{};
 return `<article class="card" data-name="${esc(name.toLowerCase())}">
   <div class="avatar">${PHOTOS[name]
    ? `<img src="${PHOTOS[name]}" alt="${esc(name)}" loading="lazy">`
    : esc(initials(name))}</div>
   <div class="name">${esc(name)}</div>
   <div class="meta">${d.gender==="M"?"Male":d.gender==="F"?"Female":"Family Member"}</div>
   ${d.note?`<div class="note">${esc(d.note)}</div>`:""}
 </article>`;
}
function couple(a,b){
 return `<div class="couple">${card(a)}<span class="plus">+</span>${card(b)}</div>`;
}
function single(n){return `<div class="couple">${card(n)}</div>`;}
function childUnit(content){return `<div class="child">${content}</div>`;}
function branch(coupleHtml, childrenHtml){
 return `<div class="unit">${coupleHtml}<div class="down"></div>${childrenHtml}</div>`;
}
function children(list){
 return `<div class="children">${list.map(x=>childUnit(x)).join("")}</div>`;
}

const tree = document.getElementById("tree");

/* Generation 1 */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 1</div>
 <div class="root-row">${card("Karan Singh")}</div>
</section>`);

/* Generation 2 */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 2</div>
 <div class="branch-row">
  ${branch(single("Raja Singh"), children([
    card("RamPrit Singh"),card("Ram Bricch Singh"),card("Bhagwan Singh"),card("Ganesh Singh")
  ]))}
  ${card("Indradev Singh")}
  ${couple("Matki Singh","Matishra Kunwar")}
 </div>
</section>`);

/* Generation 3: Raja's children + Ganesh branch shown below their parents */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 3</div>
 <div class="branch-row">
  ${branch(single("RamPrit Singh"), children([card("Jeera Devi")]))}
  ${card("Ram Bricch Singh")}
  ${card("Bhagwan Singh")}
  ${branch(couple("Ganesh Singh","Gulabo Devi"), children([
    card("Jaglal Singh"),card("Jairam Singh"),card("Phulahi Devi"),card("Lalpati Devi")
  ]))}
 </div>
</section>`);

/* Generation 4: EXACT order supplied */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 4</div>
 <div class="branch-row">
  ${branch(couple("Jaglal Singh","Rajkali Devi"), children([
    couple("Shushil K Singh","Late Dr. Sunita Singh"),
    couple("Vakil Singh","Sumitra Devi"),
    couple("Kedarnath Singh","Anita Devi"),
    couple("Poornima Devi","Sanjeet Singh"),
    couple("Bijendra Singh","Poonam Devi"),
    couple("Biresh K Singh","Lovely Devi"),
    branch(couple("Chandani Devi","Sanjeev Singh"), children([card("Arman Singh")]))
  ]))}
  ${card("Jairam Singh")}
  ${card("Phulahi Devi")}
  ${card("Lalpati Devi")}
 </div>
</section>`);

/* Generation 5 */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 5</div>
 <div class="branch-row">
  ${branch(couple("Shushil K Singh","Late Dr. Sunita Singh"), children([
    couple("Vikash Kumar","Ishita Raghuvanshi"),
    couple("Pooja Singh","Ankit (Pooja's husband)")
  ]))}
  ${branch(couple("Vakil Singh","Sumitra Devi"), children([
    couple("Preeti Singh","Manoranjan Kumar"),
    couple("Manish Singh","Riya Kumari"),
    card("Khusboo Singh")
  ]))}
  ${branch(couple("Kedarnath Singh","Anita Devi"), children([card("Akash"),card("Kajal")]))}
  ${branch(couple("Poornima Devi","Sanjeet Singh"), children([card("Rohiit"),card("Ankit (Poornima's son)")]))}
  ${branch(couple("Bijendra Singh","Poonam Devi"), children([card("Priyanshu Singh"),card("Palak")]))}
  ${branch(couple("Biresh K Singh","Lovely Devi"), children([card("Simran"),card("Aditya"),card("Arushi")]))}
 </div>
</section>`);

/* Generation 6 */
tree.insertAdjacentHTML("beforeend",`
<section class="level">
 <div class="level-title">Generation 6</div>
 <div class="branch-row">
  ${branch(couple("Vikash Kumar","Ishita Raghuvanshi"), children([card("Ishvika Kumar")]))}
  ${branch(couple("Pooja Singh","Ankit (Pooja's husband)"), children([card("Siddhart"),card("Samridhhi")]))}
  ${branch(couple("Preeti Singh","Manoranjan Kumar"), children([card("Ishan"),card("Aditi")]))}
  ${branch(couple("Manish Singh","Riya Kumari"), children([card("Kartik")]))}
 </div>
</section>`);

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();let found=0;
 document.querySelectorAll(".card").forEach(c=>{
  const ok=!q||c.dataset.name.includes(q);
  c.classList.toggle("search-hide",!ok); if(ok)found++;
 });
 document.getElementById("empty").style.display=(q&&!found)?"block":"none";
});
</script>
</body>
</html>
